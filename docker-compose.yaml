version: '3.9'

services:
  master:
    image: chrislusf/seaweedfs:4.13
    ports:
      - "9333:9333"
      - "19333:19333"
    command: 'master -ip=master -ip.bind=0.0.0.0'
    volumes:
      - seaweedfs-master-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  volume:
    image: chrislusf/seaweedfs:4.13
    ports:
      - "8080:8080"
      - "18080:18080"
    command: 'volume -ip=volume -mserver="master:9333" -ip.bind=0.0.0.0 -port=8080 -max=100'
    volumes:
      - seaweedfs-volume-data:/data
    depends_on:
      master:
        condition: service_healthy

  filer:
    image: chrislusf/seaweedfs:4.13
    ports:
      - "8888:8888"
      - "18888:18888"
    command: 'filer -master="master:9333" -ip.bind=0.0.0.0'
    volumes:
      - seaweedfs-filer-data:/data
    depends_on:
      - master
      - volume

  s3:
    image: chrislusf/seaweedfs:4.13
    ports:
      - "8333:8333"
    command: 's3 -filer="filer:8888" -ip.bind=0.0.0.0'
    depends_on:
      - master
      - volume
      - filer

volumes:
  seaweedfs-master-data:
  seaweedfs-volume-data:
  seaweedfs-filer-data: